name: kerberos-b

# Узел Б: сеть kerberos уже создана Узлом А (external).

networks:
  kerberos:
    external: true

volumes:
  keytabs-b:

services:
  kdc-b3:
    build:
      context: .
      dockerfile: kdc/Dockerfile
    hostname: ${KDC_B3_HOST}
    container_name: ${KDC_B3_HOST}
    restart: unless-stopped
    networks:
      kerberos:
        ipv4_address: ${KDC_B3_IP}
        aliases:
          - ${KDC_B3_HOST}
    environment:
      REALM: ${ORG3_REALM}
      DOMAIN: ${DOMAIN}
      KDC_HOST: ${KDC_B3_HOST}
      LDAP_HOST: ${LDAP_B_HOST}
      WEB_HOST: ${WEB_B_HOST}
      KEYTAB_PREFIX: b3
      CREATE_SERVICES: "1"
      CREATE_ORG_USERS: "1"
      CROSS_REALM_REALM: ${ORG4_REALM}
      CROSS_REALM_KEY: ${CROSS_REALM_KEY}
      KDC_MASTER_KEY: ${KDC_MASTER_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ALICE_PASSWORD: ${ALICE_PASSWORD}
      ORG_USER_PASSWORDS: ${ORG_USER_PASSWORDS_B}
      NODE_ADMIN_PASSWORD: ${NODE_ADMIN_PASSWORD}
    volumes:
      - keytabs-b:/keytabs
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x krb5kdc >/dev/null && pgrep -x kadmind >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  kdc-b4:
    build:
      context: .
      dockerfile: kdc/Dockerfile
    hostname: ${KDC_B4_HOST}
    container_name: ${KDC_B4_HOST}
    restart: unless-stopped
    networks:
      kerberos:
        ipv4_address: ${KDC_B4_IP}
        aliases:
          - ${KDC_B4_HOST}
    environment:
      REALM: ${ORG4_REALM}
      DOMAIN: ${DOMAIN}
      KDC_HOST: ${KDC_B4_HOST}
      KEYTAB_PREFIX: b4
      CREATE_ORG_USERS: "1"
      CROSS_REALM_REALM: ${ORG3_REALM}
      CROSS_REALM_KEY: ${CROSS_REALM_KEY}
      KDC_MASTER_KEY: ${KDC_MASTER_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ALICE_PASSWORD: ${ALICE_PASSWORD}
      ORG_USER_PASSWORDS: ${ORG_USER_PASSWORDS_B}
    volumes:
      - keytabs-b:/keytabs
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x krb5kdc >/dev/null && pgrep -x kadmind >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  ldap-b:
    build:
      context: .
      dockerfile: ldap/Dockerfile
    hostname: ${LDAP_B_HOST}
    container_name: ${LDAP_B_HOST}
    restart: unless-stopped
    networks:
      kerberos:
        ipv4_address: ${LDAP_B_IP}
        aliases:
          - ${LDAP_B_HOST}
    environment:
      REALM: ${ORG3_REALM}
      DOMAIN: ${DOMAIN}
      KDC_HOST: ${KDC_B3_HOST}
      LDAP_HOST: ${LDAP_B_HOST}
      KEYTAB_FILE: /keytabs/b3-ldap.keytab
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD}
      ALICE_PASSWORD: ${ALICE_PASSWORD}
      ORG_USER_PASSWORDS: ${ORG_USER_PASSWORDS_B}
      ORG_OUS: ${ORG_OUS_B}
      NODE_ADMIN_PASSWORD: ${NODE_ADMIN_PASSWORD}
      LDAP_REALM_PRIMARY: ${LDAP_REALM_PRIMARY_B}
      LDAP_OU_PRIMARY: ${LDAP_OU_PRIMARY_B}
      LDAP_REALM_SECONDARY: ${LDAP_REALM_SECONDARY_B}
      LDAP_OU_SECONDARY: ${LDAP_OU_SECONDARY_B}
      KRB5_KTNAME: FILE:/keytabs/b3-ldap.keytab
    volumes:
      - keytabs-b:/keytabs:ro
    depends_on:
      kdc-b3:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://127.0.0.1 -b '' -s base 1.1 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  keycloak-b:
    build:
      context: .
      dockerfile: keycloak/Dockerfile
    hostname: ${KEYCLOAK_B_HOST}
    container_name: ${KEYCLOAK_B_HOST}
    restart: unless-stopped
    networks:
      kerberos:
        ipv4_address: ${KEYCLOAK_B_IP}
        aliases:
          - ${KEYCLOAK_B_HOST}
    environment:
      KC_REALM: ${KC_B_REALM}
      NODE_LABEL: "Узел Б"
      DOMAIN: ${DOMAIN}
      WEB_HOST: ${WEB_B_HOST}
      PUBLIC_WEB_BASE: http://${WEB_B_HOST}:${WEB_B_PORT}
      CLIENT_SECRET: ${PORTAL_CLIENT_SECRET}
      LDAP_HOST: ${LDAP_B_HOST}
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      # Keycloak 26 по умолчанию на "/" — лаборатория тянет его под /auth,
      # как на схеме (Apache проксирует /auth без SPNEGO)
      KC_HTTP_RELATIVE_PATH: /auth
    command: start-dev --import-realm
    volumes:
      - ./keycloak/realm-node.json.tpl:/templates/realm-node.json.tpl:ro
    ports:
      - "127.0.0.1:8092:8080"
    depends_on:
      ldap-b:
        condition: service_healthy
    healthcheck:
      # В образе нет curl/wget: health-эндпоинты на management-порту 9000;
      # путь с префиксом /auth (KC_HTTP_RELATIVE_PATH)
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200' <&3"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  portal-b:
    build:
      context: .
      dockerfile: portal/Dockerfile
    hostname: ${PORTAL_B_HOST}
    container_name: ${PORTAL_B_HOST}
    restart: unless-stopped
    networks:
      kerberos:
        ipv4_address: ${PORTAL_B_IP}
        aliases:
          - ${PORTAL_B_HOST}
    environment:
      NODE_LABEL: "Узел Б"
      ORGS: ${ORG3_REALM},${ORG4_REALM}
      KC_REALM: ${KC_B_REALM}
      CLIENT_ID: portal
      CLIENT_SECRET: ${PORTAL_CLIENT_SECRET}
      KC_INTERNAL: http://${KEYCLOAK_B_HOST}:8080/auth
      # Полный список пользователей системы (только логины, для отображения).
      SYSTEM_USERS: ${SYSTEM_USERS}
    depends_on:
      keycloak-b:
        condition: service_started
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  web-b:
    build:
      context: .
      dockerfile: apache/Dockerfile
    hostname: ${WEB_B_HOST}
    container_name: ${WEB_B_HOST}
    restart: unless-stopped
    networks:
      kerberos:
        ipv4_address: ${WEB_B_IP}
        aliases:
          - ${WEB_B_HOST}
    environment:
      REALM: ${ORG3_REALM}
      DOMAIN: ${DOMAIN}
      KDC_HOST: ${KDC_B3_HOST}
      WEB_HOST: ${WEB_B_HOST}
      KEYTAB_FILE: /keytabs/b3-http.keytab
      PORTAL_HOST: ${PORTAL_B_HOST}
      KEYCLOAK_HOST: ${KEYCLOAK_B_HOST}
      KRB5_KTNAME: FILE:/keytabs/b3-http.keytab
    volumes:
      - keytabs-b:/keytabs:ro
    ports:
      - "127.0.0.1:${WEB_B_PORT}:80"
    depends_on:
      kdc-b3:
        condition: service_healthy
      portal-b:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x apache2 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
