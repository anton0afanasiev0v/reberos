name: reberos

networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.10.0/24

volumes:
  keytabs:
  prometheus-data:
  grafana-data:

services:
  kdc:
    build:
      context: .
      dockerfile: kdc/Dockerfile
    hostname: ${KDC_HOST}
    container_name: ${KDC_HOST}
    restart: unless-stopped
    networks:
      lab:
        ipv4_address: ${KDC_IP}
        aliases:
          - ${KDC_HOST}
    environment:
      REALM: ${REALM}
      DOMAIN: ${DOMAIN}
      KDC_HOST: ${KDC_HOST}
      LDAP_HOST: ${LDAP_HOST}
      WEB_HOST: ${WEB_HOST}
      KEYCLOAK_HOST: ${KEYCLOAK_HOST}
      KDC_IP: ${KDC_IP}
      LDAP_IP: ${LDAP_IP}
      WEB_IP: ${WEB_IP}
      KDC_MASTER_KEY: ${KDC_MASTER_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ALICE_PASSWORD: ${ALICE_PASSWORD}
    volumes:
      - keytabs:/keytabs
    ports:
      - "127.0.0.1:88:88/tcp"
      - "127.0.0.1:88:88/udp"
      - "127.0.0.1:749:749/tcp"
      - "127.0.0.1:464:464/tcp"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x krb5kdc >/dev/null && pgrep -x kadmind >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  ldap:
    build:
      context: .
      dockerfile: ldap/Dockerfile
    hostname: ${LDAP_HOST}
    container_name: ${LDAP_HOST}
    restart: unless-stopped
    networks:
      lab:
        ipv4_address: ${LDAP_IP}
        aliases:
          - ${LDAP_HOST}
    environment:
      REALM: ${REALM}
      DOMAIN: ${DOMAIN}
      KDC_HOST: ${KDC_HOST}
      LDAP_HOST: ${LDAP_HOST}
      KDC_IP: ${KDC_IP}
      LDAP_IP: ${LDAP_IP}
      WEB_IP: ${WEB_IP}
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD}
      ALICE_PASSWORD: ${ALICE_PASSWORD}
      KRB5_KTNAME: FILE:/keytabs/ldap.keytab
    volumes:
      - keytabs:/keytabs:ro
    ports:
      - "127.0.0.1:389:389"
    depends_on:
      kdc:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://127.0.0.1 -b '' -s base 1.1 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    hostname: client.${DOMAIN}
    container_name: client.${DOMAIN}
    restart: unless-stopped
    networks:
      lab:
        ipv4_address: 172.30.10.30
        aliases:
          - client.${DOMAIN}
    environment:
      REALM: ${REALM}
      DOMAIN: ${DOMAIN}
      KDC_HOST: ${KDC_HOST}
      LDAP_HOST: ${LDAP_HOST}
      WEB_HOST: ${WEB_HOST}
      ALICE_PASSWORD: ${ALICE_PASSWORD}
    depends_on:
      kdc:
        condition: service_healthy
      ldap:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apache/Dockerfile
    profiles: ["apache"]
    hostname: ${WEB_HOST}
    container_name: ${WEB_HOST}
    restart: unless-stopped
    networks:
      lab:
        ipv4_address: 172.30.10.40
        aliases:
          - ${WEB_HOST}
    environment:
      REALM: ${REALM}
      DOMAIN: ${DOMAIN}
      KDC_HOST: ${KDC_HOST}
      WEB_HOST: ${WEB_HOST}
      GRAFANA_HOST: ${GRAFANA_HOST}
      KRB5_KTNAME: FILE:/keytabs/http.keytab
    volumes:
      - keytabs:/keytabs:ro
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      kdc:
        condition: service_healthy
      grafana:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x apache2 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  prometheus:
    image: prom/prometheus:v3.15.0
    hostname: ${PROMETHEUS_HOST}
    container_name: ${PROMETHEUS_HOST}
    restart: unless-stopped
    networks:
      lab:
        ipv4_address: ${PROMETHEUS_IP}
        aliases:
          - ${PROMETHEUS_HOST}
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  blackbox:
    image: prom/blackbox-exporter:v0.29.0
    hostname: ${BLACKBOX_HOST}
    container_name: ${BLACKBOX_HOST}
    restart: unless-stopped
    networks:
      lab:
        ipv4_address: ${BLACKBOX_IP}
        aliases:
          - ${BLACKBOX_HOST}
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - --config.file=/etc/blackbox_exporter/config.yml

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    hostname: ${CADVISOR_HOST}
    container_name: ${CADVISOR_HOST}
    restart: unless-stopped
    networks:
      lab:
        ipv4_address: ${CADVISOR_IP}
        aliases:
          - ${CADVISOR_HOST}
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  grafana:
    image: grafana/grafana:13.2.4
    hostname: ${GRAFANA_HOST}
    container_name: ${GRAFANA_HOST}
    restart: unless-stopped
    networks:
      lab:
        ipv4_address: ${GRAFANA_IP}
        aliases:
          - ${GRAFANA_HOST}
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: http://${WEB_HOST}:8080/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_LOGIN: "false"
      GF_USERS_AUTO_ASSIGN_ORG: "true"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3000/api/health || wget -q --spider http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  keycloak:
    build:
      context: .
      dockerfile: keycloak/Dockerfile
    profiles: ["keycloak"]
    hostname: ${KEYCLOAK_HOST}
    container_name: ${KEYCLOAK_HOST}
    restart: unless-stopped
    networks:
      lab:
        ipv4_address: ${KEYCLOAK_IP}
        aliases:
          - ${KEYCLOAK_HOST}
    environment:
      REALM: ${REALM}
      DOMAIN: ${DOMAIN}
      KDC_HOST: ${KDC_HOST}
      LDAP_HOST: ${LDAP_HOST}
      KEYCLOAK_HOST: ${KEYCLOAK_HOST}
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      # SPNEGO/Kerberos в Keycloak 26 — за feature-флагом
      KC_FEATURES: "kerberos"
      # SPNEGO шлёт HTTP/1.1-запросы в моменты 401/Negotiate-обменов;
      # без отключения HTTP/2 Vert.x отвечает 500 (keycloak#45863)
      KC_HTTP_HTTP2: "false"
      KC_HOSTNAME_STRICT: "false"
    command: start-dev --import-realm
    volumes:
      - keytabs:/keytabs:ro
      - ./keycloak/realm-lab.json.tpl:/templates/realm-lab.json.tpl:ro
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      kdc:
        condition: service_healthy
      ldap:
        condition: service_healthy
    healthcheck:
      # В образе нет curl/wget: health-эндпоинты на management-порту 9000,
      # читаем ответ через bash /dev/tcp
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200' <&3"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
