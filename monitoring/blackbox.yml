# Модули blackbox-exporter для проверок лаборатории.

modules:
  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4

  http_2xx:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4
      valid_status_codes: [200]

  # Закрытый ресурс Apache: без Kerberos-билета — ровно 401.
  http_expect_401:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4
      valid_status_codes: [401]
      headers:
        Accept: "*/*"
